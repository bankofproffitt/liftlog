<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<body>
<title>LiftLog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E0F11">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Dark, high-contrast gym look: one orange action color, blue for "ready", big condensed numbers.
   Dark is the default; Settings → Appearance sets data-theme="light". */
:root {
  --bg: #0E0F11;
  --surface: #1A1C20;
  --surface-2: #24272C;
  --ink: #F4F4F2;
  --muted: #A3A7AE;
  --line: #2C2F35;
  --accent: #FF8A1F;          /* action fill */
  --accent-ink: #141414;      /* text on the action fill */
  --accent-text: #FFB066;     /* accent used as text */
  --accent-soft: #3A2410;
  --ready: #5AB0FF;           /* ready / in-zone (blue, colorblind-safe next to orange) */
  --ready-ink: #DCEEFF;
  --ready-soft: #13263A;
  --good: #5AB0FF;
  --warn: #E0AA4E;
  --bad: #EC7B7B;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
  --nav-h: 64px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F4F4F1; --surface: #FFFFFF; --surface-2: #ECEDEF; --ink: #141414; --muted: #5D6168; --line: #E0E2E6;
  --accent: #FF8A1F; --accent-ink: #141414; --accent-text: #B85400; --accent-soft: #FFE8D2;
  --ready: #0B5CA3; --ready-ink: #0A3A66; --ready-soft: #E3F0FC;
  --good: #0B5CA3; --warn: #9A620F; --bad: #B03636; color-scheme: light;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
#app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--nav-h) + 150px + env(safe-area-inset-bottom, 0px)); }
h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
h2 { font-size: 2rem; line-height: 1.05; }
h3 { font-size: 1.3rem; line-height: 1.1; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-family: var(--font-display); font-weight: 600; font-size: 0.82rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.note, .meta { color: var(--muted); font-size: 0.9rem; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.unit { font-family: var(--font-display); font-weight: 600; color: var(--muted); margin-left: 4px; font-size: 1.1rem; }

/* Header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { padding-block: 14px 0; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.mark { width: 16px; height: 16px; border-radius: 50%; border: 4px solid var(--ink); box-shadow: inset 0 0 0 2px var(--bg), inset 0 0 0 5px var(--accent); }
/* Bottom tab bar: within thumb reach */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { border: 0; background: transparent; min-height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 500; font-size: 0.75rem; color: var(--muted); }
.tabs button svg { width: 24px; height: 24px; }
.tabs button.on { color: var(--accent-text); font-weight: 600; }

main > section { display: flex; flex-direction: column; gap: 16px; padding-top: 12px; }
.dayhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.dayhead h2 { font-size: 2.75rem; line-height: 1; }
.sub { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
.clock { font-variant-numeric: tabular-nums; }

/* Lift cards */
.lifts { display: flex; flex-direction: column; gap: 12px; }
.lift { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lift header { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.lift header h3 { margin-right: auto; }
.scheme { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.count { font-family: var(--font-display); font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.lift.done .count { color: var(--good); }
.target { display: flex; align-items: baseline; }
.target .big { font-size: 2.6rem; }
.plates { font-size: 0.9rem; color: var(--ink); opacity: 0.85; font-variant-numeric: tabular-nums; }
.why { font-size: 0.88rem; color: var(--muted); }
.why strong { color: var(--accent-text); font-weight: 600; }
.why strong.same { color: var(--ink); }
.rest { font-size: 0.82rem; color: var(--muted); }
.pill { font-family: var(--font-display); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.startw { display: flex; align-items: center; gap: 10px; font-weight: 500; flex-wrap: wrap; }
.inline-input { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.inline-input input { width: 6.5em; }
input[type="number"], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-variant-numeric: tabular-nums; min-width: 0; }
textarea { width: 100%; resize: vertical; font-family: var(--font-body); line-height: 1.5; }

/* Buttons */
.primary, .ghost, .danger { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 14px; padding: 11px 20px; font-weight: 600; text-decoration: none; border: 1px solid transparent; min-height: 48px; }
.primary { background: var(--accent); color: var(--accent-ink); }
.primary.wide, .primary.big-btn { min-height: 64px; border-radius: 16px; font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: 0.02em; }
.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.ghost.small { min-height: 36px; padding: 6px 14px; font-size: 0.9rem; }
.danger { background: var(--bad); color: #fff; }
.wide { width: 100%; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 6px 0; }
button:disabled { opacity: 0.5; cursor: default; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* Freestyle picker */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 999px; font-size: 0.92rem; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Live logging */
.sets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.sets > li { border-bottom: 1px solid var(--line); }
.setrow { width: 100%; display: grid; grid-template-columns: 2.2em 1fr auto auto auto; gap: 10px; align-items: baseline; padding: 9px 2px; background: none; border: 0; text-align: left; font-variant-numeric: tabular-nums; min-height: 44px; }
.setrow:hover { background: var(--accent-soft); }
.setrow .n { font-family: var(--font-display); font-weight: 600; color: var(--muted); }
.setrow .wr { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
.setrow .rir, .setrow .rs { font-size: 0.85rem; color: var(--muted); }
.setrow .pen { font-size: 0.78rem; color: var(--accent-text); font-weight: 600; }
.setrow.hit .n { color: var(--good); }
.setrow.miss .n { color: var(--bad); }
.setrow.wu { opacity: 0.75; }
.editrow { background: var(--accent-soft); margin-inline: -16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.edactions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.edactions button { flex: 1 1 auto; }
.warmups { display: flex; flex-direction: column; gap: 6px; }
.wchips { display: flex; flex-wrap: wrap; gap: 6px; }
.wchip { border: 1px dashed var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 12px; min-height: 40px; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.wchip.done { border-style: solid; border-color: var(--good); color: var(--good); background: transparent; opacity: 1; }
.wline { font-family: var(--font-display); font-size: 0.98rem; color: var(--muted); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.recov { border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); background: var(--surface); }
.recov.ok { background: var(--ready-soft); border-color: transparent; color: var(--ready-ink); }
.recov.ok strong { color: var(--ready-ink); }
.recov.ok .note { color: var(--ready-ink); opacity: 0.85; }
.recov.wait { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.recov.wait strong { color: var(--warn); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row2 input, .actform input { width: 100%; }
.seg.seg3 { grid-template-columns: repeat(3, 1fr); }
.seg.seg3 button { font-family: var(--font-body); font-weight: 600; font-size: 0.95rem; }
.actform .field { font-size: 0.82rem; color: var(--muted); font-weight: 500; }
.actform textarea, .history textarea { color: var(--ink); }
.history .field { font-size: 0.82rem; color: var(--muted); font-weight: 500; }
.session .tools { display: flex; gap: 16px; }
.session .tools .link { font-size: 0.9rem; color: var(--accent-text); min-height: 32px; display: inline-flex; align-items: center; }
.session.act pre { color: var(--muted); }
.entry { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; margin-top: 4px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .flabel { font-size: 0.82rem; color: var(--muted); font-weight: 500; }
.field.inline { flex-direction: row; align-items: center; gap: 12px; }
.rirfield { grid-column: 1 / -1; }
.stepper { display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; align-items: center; gap: 4px; border-radius: 16px; background: var(--bg); padding: 6px; }
.stepper button { border: 0; background: var(--surface-2); border-radius: 50%; width: 56px; height: 56px; font-size: 1.7rem; font-weight: 600; }
.stepper input { border: 0; border-radius: 0; background: transparent; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 2.4rem; width: 100%; padding: 4px 0; }
/* Live entry: each control gets the full width so numbers read at arm's length */
.entry > .field, .entry > .wu-toggle, .entry > .primary { grid-column: 1 / -1; }
.entry > .primary { min-height: 64px; border-radius: 16px; font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; }
.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.seg button { border: 2px solid transparent; border-radius: 12px; background: var(--bg); min-height: 52px; font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; }
.seg button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
.seg.seg2 { grid-template-columns: repeat(2, 1fr); background: var(--surface); padding: 4px; border-radius: 14px; gap: 4px; }
.seg.seg2 button { font-family: var(--font-body); font-size: 1rem; font-weight: 600; min-height: 48px; border: 0; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; }
.seg.seg2 button.on { background: var(--accent-soft); color: var(--accent-text); }
.wu-toggle { display: flex; align-items: center; gap: 8px; font-size: 0.92rem; color: var(--muted); }
.wu-toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.discard { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.92rem; }

/* Rest bar */
.restbar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; }
.restinfo { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.restinfo .clock { font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; line-height: 1; }
.restinfo .range { font-size: 0.85rem; color: var(--muted); }
.restmeter { grid-column: 1 / -1; grid-row: 2; height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.restmeter div { height: 100%; width: 0; background: var(--accent); transition: width 0.9s linear; }
.restbar[data-zone="ready"] .restmeter div { background: var(--ready); }
.restbar[data-zone="ready"] .clock { color: var(--ready); }
.restbar[data-zone="long"] .restmeter div { background: var(--warn); }
.restbar[data-zone="long"] .clock { color: var(--warn); }

/* Finished */
.finished h2 { font-size: 2.2rem; }

/* History */
.e1grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.e1 { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.e1 .big { font-size: 2.2rem; }
.e1 .sub { font-size: 0.82rem; color: var(--muted); }
.spark { margin-top: 6px; max-width: 100%; }
.sessions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.session { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.session .when { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; color: var(--muted); font-size: 0.92rem; }
.session .when strong { color: var(--ink); font-weight: 600; }
.session pre { margin: 0; font-family: var(--font-body); font-size: 0.95rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.banner { background: var(--accent-soft); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 0.92rem; }
.emptystate { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.backup { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }

/* Settings */
.settings h2 { font-size: 1.4rem; margin-top: 4px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; cursor: pointer; min-width: 0; }
.opt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt input { accent-color: var(--accent); margin-top: 4px; }
.opt span { display: flex; flex-direction: column; min-width: 0; }
.opt small { color: var(--muted); font-size: 0.85rem; }
.programcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.switch { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-weight: 500; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 120px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 8px 8px 16px; border-radius: 999px; font-size: 0.92rem; z-index: 20; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 12px; }
.toast:not(:has(button)) { padding-right: 16px; }
.toast button { background: var(--bg); color: var(--ink); border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 600; min-height: 36px; }

@media (max-width: 380px) { .opts, .row2 { grid-template-columns: 1fr; } .dayhead h2 { font-size: 2.2rem; } }
@media (prefers-reduced-motion: reduce) { .restmeter div { transition: none; } }
</style>

<div id="app"></div>

<script>
// LiftLog core: exercises, programs, progression engine, estimates, summary.
// Pure functions with no DOM access, so the same file runs in the browser and in Node tests.
// Evidence behind each rule is listed in DESIGN.md.

// ---------- Exercises ----------

const EXERCISES = {
  squat:       { id: "squat",       name: "Back Squat",     short: "Squat",       category: "core",  incrementLb: 5,  rest: [180, 300] },
  bench:       { id: "bench",       name: "Bench Press",    short: "Bench",       category: "core",  incrementLb: 5,  rest: [180, 300] },
  deadlift:    { id: "deadlift",    name: "Deadlift",       short: "Deadlift",    category: "core",  incrementLb: 10, rest: [180, 300], floor: true },
  ohp:         { id: "ohp",         name: "Overhead Press", short: "Press",       category: "core",  incrementLb: 5,  rest: [180, 300] },
  power_clean: { id: "power_clean", name: "Power Clean",    short: "Clean",       category: "power", incrementLb: 5,  rest: [180, 300], floor: true },
  // Not in the default programs yet; chosen for Highland Games carryover.
  push_press:  { id: "push_press",  name: "Push Press",     short: "Push Press",  category: "power", incrementLb: 5,  rest: [180, 300] },
  front_squat: { id: "front_squat", name: "Front Squat",    short: "Front Squat", category: "core",  incrementLb: 5,  rest: [180, 300] },
};

function incrementFor(ex, unit = "lb") {
  return unit === "lb" ? ex.incrementLb : ex.incrementLb / 2;
}

// ---------- Settings ----------

const DEFAULT_SETTINGS = {
  unit: "lb",
  smallestJump: 5,            // 5 lb with 2.5 lb plates; 2.5 lb with 1.25 lb microplates
  failuresBeforeDeload: 3,
  deloadFraction: 0.10,
  deloadsBeforeIntermediate: 2,
  goal: "strengthAndPower",   // "strength" | "strengthAndPower"
  trainingAge: "novice",      // "novice" | "intermediate"
  followProgram: true,        // false = freestyle
  barWeight: 45,
  theme: "dark",              // "dark" | "light"
};

// ---------- Logged-data helpers ----------
// set:     { weight, reps, targetReps, rir|null, warmup, startedAt|null, completedAt }  (times in ms)
// entry:   { exerciseId, sets: [set] }
// workout: { id, dayName, startedAt, endedAt|null, unit, entries: [entry], notes }

// Sessions are lifting workouts unless kind === "activity" (cardio, throwing practice, sport...).
const isLift = (w) => !w.kind || w.kind === "lift";

const workingSets = (entry) => entry.sets.filter((s) => !s.warmup);
const hitTarget = (s) => s.reps >= s.targetReps;

function topWorkingWeight(entry) {
  const ws = workingSets(entry);
  return ws.length ? Math.max(...ws.map((s) => s.weight)) : null;
}

function allTargetsHit(entry) {
  const ws = workingSets(entry);
  return ws.length > 0 && ws.every(hitTarget);
}

function minRIR(entry) {
  const r = workingSets(entry).map((s) => s.rir).filter((v) => v !== null && v !== undefined);
  return r.length ? Math.min(...r) : null;
}

/** Seconds between consecutive sets. Uses the next set's start when recorded,
 *  otherwise completion to completion (which includes that set's own duration). */
function restIntervals(entry) {
  const sets = [...entry.sets].sort((a, b) => a.completedAt - b.completedAt);
  const out = [];
  for (let i = 1; i < sets.length; i++) {
    const end = sets[i].startedAt ?? sets[i].completedAt;
    out.push((end - sets[i - 1].completedAt) / 1000);
  }
  return out;
}

const durationSeconds = (w) => (w.endedAt ? (w.endedAt - w.startedAt) / 1000 : null);
const workingSetCount = (w) => w.entries.reduce((n, e) => n + workingSets(e).length, 0);
const workingVolume = (w) =>
  w.entries.flatMap(workingSets).reduce((v, s) => v + s.weight * s.reps, 0);

// ---------- Programs ----------

const slot = (exerciseId, sets, reps, optional = false) => ({ exerciseId, sets, reps, optional });

const PROGRAMS = {
  "nlp-ab": {
    id: "nlp-ab",
    name: "Novice Linear Progression",
    days: [
      { name: "A", slots: [slot("squat", 3, 5), slot("bench", 3, 5), slot("deadlift", 1, 5)] },

// Workouts are shown by focus rather than letter; stored dayName stays "A"/"B" so old history keeps working.
const DAY_TITLES = { A: "Bench & Deadlift", B: "Clean & Press" };
const dayTitle = (dayName) => DAY_TITLES[dayName] ?? dayName;

function recommendProgram(goal, trainingAge) {
  if (trainingAge === "intermediate") return PROGRAMS["hlm-4wk"];
  return goal === "strength" ? PROGRAMS["nlp-ab"] : PROGRAMS["nlp-ab-power"];
}

/** Next day in the program's cycle, from the most recent workout that used it. */
function nextDay(program, history) {
  const names = program.days.map((d) => d.name);
  const last = history
    .filter((w) => names.includes(w.dayName))
    .sort((a, b) => b.startedAt - a.startedAt)[0];
  if (!last) return program.days[0];
  return program.days[(names.indexOf(last.dayName) + 1) % program.days.length];
}

// ---------- Progression engine ----------

const roundToPlates = (w, step) => (step > 0 ? Math.round(w / step) * step : w);

/** Next weight after a successful session; the reason describes the jump actually prescribed. */
function nextAfterSuccess(ex, weight, rir, settings) {
  const base = incrementFor(ex, settings.unit);
  let amount = base;
  if (rir === 0) amount = base / 2;
  else if (rir !== null && rir >= 3) amount = base * 2;
  const cap = weight * 0.1;
  const capped = amount > cap;
  amount = Math.min(amount, cap);

  let next = roundToPlates(weight + amount, settings.smallestJump);
  if (next - weight < settings.smallestJump) next = weight + settings.smallestJump;
  const jump = next - weight;

  let reason;
  if (rir === 0 && jump < base) reason = "All reps made, but the last set was a grinder (0 RIR), so a smaller jump.";
  else if (rir === 0) reason = "All reps made, but the last set was a grinder (0 RIR), so the smallest jump your plates allow.";
  else if (rir !== null && rir >= 3 && jump > base) reason = `All reps made with ${rir}+ reps in reserve, so a bigger jump.`;
  else if (rir !== null && rir >= 3 && capped) reason = `All reps made with ${rir}+ reps in reserve, but jumps are capped at 10% of the working weight.`;
  else reason = "All reps made, so the standard jump.";
  return { next, reason };
}

/** Rebuild a lift's state from logged history. Follows what was actually lifted. */
function replay(ex, history, settings = DEFAULT_SETTINGS) {
  const s = settings;
  const state = { nextWeight: null, failures: 0, deloads: 0, outcome: "none", reason: "", lastDate: null };
  const entries = [...history]
    .sort((a, b) => a.startedAt - b.startedAt)
    .map((w) => ({ w, e: w.entries.find((e) => e.exerciseId === ex.id && workingSets(e).length) }))
    .filter((x) => x.e);

  for (const { w, e } of entries) {
    const used = topWorkingWeight(e);
    state.lastDate = w.startedAt;
    if (allTargetsHit(e)) {
      const step = nextAfterSuccess(ex, used, minRIR(e), s);
      Object.assign(state, { nextWeight: step.next, failures: 0, outcome: "progressed", reason: step.reason });
    } else {
      state.failures += 1;
      if (state.failures >= s.failuresBeforeDeload) {
        Object.assign(state, {
          nextWeight: roundToPlates(used * (1 - s.deloadFraction), s.smallestJump),
          failures: 0,
          deloads: state.deloads + 1,
          outcome: "deloaded",
          reason: `Missed reps ${s.failuresBeforeDeload} sessions in a row at this weight, so deload ${Math.round(s.deloadFraction * 100)}% and build back up.`,
        });
      } else {
        Object.assign(state, {
          nextWeight: used,
          outcome: "repeated",
          reason: `Missed reps (${state.failures} of ${s.failuresBeforeDeload} before a deload), so repeat this weight.`,
        });
      }
    }
  }
  return state;
}

function prescribe(ex, sl, history, settings = DEFAULT_SETTINGS) {
  const st = replay(ex, history, settings);
  const base = { exerciseId: ex.id, sets: sl.sets, reps: sl.reps, rest: ex.rest, flags: [] };
  if (st.nextWeight === null) {
    return {
      ...base,
      weight: 0,
      flags: ["firstSession"],
      rationale: `No history yet. Pick a weight you can lift for ${sl.sets}×${sl.reps} with about 3 reps in reserve; the app adjusts from there.`,
    };
  }
  let rationale = st.reason;
  const flags = [];
  if (st.outcome === "deloaded") flags.push("deload");
  if (st.deloads >= settings.deloadsBeforeIntermediate) {
    flags.push("considerIntermediate");
    rationale += ` This lift has needed ${st.deloads} deloads, so per-session progress is likely used up. Consider the Heavy / Light / Medium program.`;
  }
  if (ex.category === "power") rationale += " Power lift: end the set if bar speed or technique drops.";
  return { ...base, weight: st.nextWeight, flags, rationale };
}

// ---------- Estimates ----------

/** Epley, using reps + RIR as reps to failure; null above 10. Missing RIR counts as 0 (conservative). */
function e1RM(weight, reps, rir) {
  const toFailure = reps + (rir ?? 0);
  if (reps <= 0 || toFailure > 10) return null;
  if (toFailure === 1) return weight;
  return weight * (1 + toFailure / 30);
}

function bestE1RM(entry) {
  const v = workingSets(entry).map((s) => e1RM(s.weight, s.reps, s.rir)).filter((x) => x !== null);
  return v.length ? Math.max(...v) : null;
}

function e1RMTrend(exerciseId, history) {
  return [...history]
    .sort((a, b) => a.startedAt - b.startedAt)
    .map((w) => {
      const e = w.entries.find((x) => x.exerciseId === exerciseId);
      const v = e ? bestE1RM(e) : null;
      return v === null ? null : { date: w.startedAt, value: v };
    })
    .filter(Boolean);
}

// ---------- Plate math ----------

/** Plates per side for a barbell load, largest first. Returns null if it can't be made exactly. */
function platesPerSide(total, bar = 45, smallestJump = 5) {
  if (total < bar) return null;
  const plates = smallestJump <= 2.5 ? [45, 35, 25, 10, 5, 2.5, 1.25] : [45, 35, 25, 10, 5, 2.5];
  let side = (total - bar) / 2;
  const out = [];
  for (const p of plates) {
    while (side >= p - 1e-9) { out.push(p); side -= p; }
  }
  return Math.abs(side) < 1e-9 ? out : null;
}

// ---------- Warm-ups ----------

/** Suggested warm-up sets ramping to the working weight.
 *  Bar lifts: empty bar 2×5, then about 40/60/80%. Floor lifts (deadlift, clean) start at 135
 *  when the work weight allows, since the bar needs 45 lb plates to sit at the right height.
 *  Power lifts use fewer reps so warm-ups don't tire you before the fast work. Steps closer
 *  than ~8% of the work weight are skipped. */
function warmupSets(ex, work, bar = 45, step = 5) {
  if (!work || work <= bar) return [];
  const power = ex.category === "power";
  const start = ex.floor && work >= 155 ? 135 : bar;
  const firstReps = power ? 3 : 5;
  const out = [{ weight: start, reps: firstReps }];
  if (start === bar) out.push({ weight: bar, reps: firstReps });
  const ramp = power ? [[0.5, 3], [0.7, 2], [0.85, 1]] : [[0.4, 5], [0.6, 3], [0.8, 2]];
  const gap = Math.max(2 * step, work * 0.08);
  for (const [pct, reps] of ramp) {
    const w = roundToPlates(work * pct, step);
    const prev = out[out.length - 1].weight;
    if (w - prev < gap || work - w < gap) continue;
    out.push({ weight: w, reps });
  }
  return out;
}

// ---------- Recovery between sessions ----------

const HOUR = 3_600_000;

/** When the next lifting session is due. Full-body sessions sit about 48 h apart
 *  (every other day, ACSM's 2-3 sessions a week for novices). A hard last session
 *  (missed reps or a 0-RIR grinder) gets up to 72 h. Hard cardio since then gets a note,
 *  because heavy endurance work close to lifting can blunt strength and power. */
function recovery(history, now = Date.now()) {
  const lifts = history.filter(isLift).sort((a, b) => b.startedAt - a.startedAt);
  const last = lifts[0];
  if (!last) return null;
  const end = last.endedAt ?? last.startedAt;
  const hard = last.entries.some((e) => workingSets(e).some((s) => !hitTarget(s) || s.rir === 0));
  const hours = hard ? 72 : 48;
  const readyAt = end + hours * HOUR;
  const hardCardio = history.some((w) => !isLift(w) && ENDURANCE.has(w.activity?.type) && w.activity?.effort === "hard" &&
    (w.endedAt ?? w.startedAt) > end && now - (w.endedAt ?? w.startedAt) < 24 * HOUR);
  const reason = hard
    ? "Your last session had missed reps or a 0-RIR grinder, so allow up to 72 h before the next one."
    : "Full-body sessions work best about 48 h apart, which matches your every-other-day plan.";
  return {
    lastEnd: end, readyAt, hours, hard, hardCardio,
    ready: now >= readyAt,
    hoursSince: (now - end) / HOUR,
    hoursLeft: Math.max(0, (readyAt - now) / HOUR),
    reason,
  };
}

// ---------- Activities (cardio and other training) ----------

const ACTIVITY_TYPES = {
  run: "Run", bike: "Bike", row: "Row", walk: "Walk", swim: "Swim",
  throws: "Throwing practice", sport: "Sport", other: "Other",
};

/** Endurance types: the ones that can interfere with strength and power when hard. */
const ENDURANCE = new Set(["run", "bike", "row", "walk", "swim"]);

function activityLine(w) {
  const a = w.activity ?? {};
  const parts = [ACTIVITY_TYPES[a.type] ?? "Activity"];
  if (a.minutes) parts.push(`${a.minutes} min`);
  if (a.distance) parts.push(`${fmt(Number(a.distance))} ${a.distanceUnit || "mi"}`);
  if (a.effort) parts.push(a.effort);
  return parts.join(" · ");
}

// ---------- Summary ----------

const fmt = (w) => (Number.isInteger(w) ? String(w) : w.toFixed(1));
const grouped = (v) => Math.round(v).toLocaleString("en-US");

function setsDescription(sets, unit) {
  const f = sets[0];
  if (sets.every((s) => s.weight === f.weight && s.reps === f.reps)) return `${sets.length}×${f.reps} @ ${fmt(f.weight)} ${unit}`;
  return sets.map((s) => `${fmt(s.weight)}×${s.reps}`).join(", ") + ` ${unit}`;
}

function status(entry) {
  if (allTargetsHit(entry)) return " ✓";
  const ws = workingSets(entry);
  const done = ws.reduce((n, s) => n + s.reps, 0);
  const target = ws.reduce((n, s) => n + s.targetReps, 0);
  return ` (${done}/${target} reps)`;
}

/** Plain-text summary for the SMS composer. The user reviews it and taps Send. */
function summaryText(workout, nextUp = []) {
  if (!isLift(workout)) {
    return [`🏃 ${activityLine(workout)}`, workout.notes].filter(Boolean).join("\n");
  }
  const unit = workout.unit;
  const lines = [];
  let header = workout.dayName ? `💪 ${dayTitle(workout.dayName)}` : "💪 Workout";
  const d = durationSeconds(workout);
  if (d !== null) header += ` · ${Math.round(d / 60)} min`;
  lines.push(header);
  for (const e of workout.entries) {
    const ws = workingSets(e);
    if (!ws.length) continue;
    lines.push(`${EXERCISES[e.exerciseId]?.short ?? e.exerciseId} ${setsDescription(ws, unit)}${status(e)}`);
  }
  lines.push(`${workingSetCount(workout)} work sets · ${grouped(workingVolume(workout))} ${unit} moved`);
  const next = nextUp.filter((p) => p.weight > 0).map((p) => `${EXERCISES[p.exerciseId]?.short ?? p.exerciseId} ${fmt(p.weight)}`);
  if (next.length) lines.push("Next: " + next.join(" · "));
  return lines.join("\n");
}

// LiftLog UI. Depends on core.js (inlined before this file at build time).

// ---------- Storage (on this device only) ----------
const KEY = { settings: "liftlog.settings", history: "liftlog.history", active: "liftlog.active" };
const store = {
  load(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
  },
  save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
  },
};

const state = {
  settings: { ...DEFAULT_SETTINGS, ...store.load(KEY.settings, {}) },
  history: store.load(KEY.history, []),
  active: (() => {
    const a = store.load(KEY.active, null);   // fill fields added after version 1
    if (a) { a.warmDone ??= {}; a.restWarm ??= false; a.kind ??= "lift"; }
    return a;
  })(),
  view: "today",
  startWeights: {},      // exerciseId -> chosen starting weight for first sessions
  freestyle: [],         // exerciseIds picked in freestyle mode
  finished: null,        // workout or activity just finished, awaiting save
  confirmDiscard: false,
  restoreOpen: false,
  editing: null,         // { scope: "active" | workoutId, exerciseId, index }
  editDraft: null,       // { weight, reps, rir, warmup }
  sessionOpen: null,     // workout id being edited in History
  confirmDeleteSession: false,
  activityForm: null,    // { type, minutes, distance, effort, notes }
  addExerciseOpen: false,
  toast: null,           // { msg, action, label }
};

const persist = () => {
  store.save(KEY.settings, state.settings);
  store.save(KEY.history, state.history);
  store.save(KEY.active, state.active);
};

// ---------- Helpers ----------
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clock = (sec) => {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
};
const dateLabel = (ms) => new Date(ms).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const timeLabel = (ms) => new Date(ms).toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" });
const hoursLabel = (h) => (h < 1 ? "under an hour" : Math.round(h) + " h");
const program = () => recommendProgram(state.settings.goal, state.settings.trainingAge);
const unit = () => state.settings.unit;
const bar = () => state.settings.barWeight;
const step = () => state.settings.smallestJump;
const getWorkout = (scope) => (scope === "active" ? state.active : state.history.find((w) => w.id === scope));
const getEntry = (scope, exerciseId) => getWorkout(scope)?.entries.find((e) => e.exerciseId === exerciseId);
const weightLabel = (w) => (w === bar() ? "Bar" : fmt(w));

function toast(msg, action = null, label = "Undo") {
  state.toast = { msg, action, label };
  renderToast();
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { state.toast = null; renderToast(); }, action ? 6000 : 2400);
}
function renderToast() {
  const t = $("#toast");
  if (!t) return;
  const tt = state.toast;
  t.hidden = !tt;
  t.innerHTML = tt ? `<span>${esc(tt.msg)}</span>${tt.action ? `<button data-action="toast-action">${esc(tt.label)}</button>` : ""}` : "";
}

function plateLine(weight) {
  if (!weight) return "";
  if (weight === bar()) return "Empty bar";
  const plates = platesPerSide(weight, bar(), step());
  return plates ? "Per side: " + plates.map(fmt).join(" · ") : "";
}

function warmupLine(ex, weight) {
  const wu = warmupSets(ex, weight, bar(), step());
  if (!wu.length) return "";
  return "Warm-up: " + wu.map((s) => `${weightLabel(s.weight)}×${s.reps}`).join(" · ");
}

/** Slots for today: from the program, or the freestyle picks. */
const defaultSlot = (id) => ({
  exerciseId: id,
  sets: EXERCISES[id].category === "power" ? 5 : 3,
  reps: EXERCISES[id].category === "power" ? 3 : 5,
});
function todaySlots() {
  if (state.settings.followProgram) {
    const day = nextDay(program(), state.history);
    return { dayName: day.name, slots: day.slots.filter((s) => EXERCISES[s.exerciseId]) };
  }
  return { dayName: "", slots: state.freestyle.map(defaultSlot) };
}

// ---------- Workout actions ----------
function planFor(sl) {
  const p = prescribe(EXERCISES[sl.exerciseId], sl, state.history, state.settings);
  if (p.weight === 0) p.weight = Number(state.startWeights[sl.exerciseId]) || bar();
  return p;
}

function startWorkout() {
  const { dayName, slots } = todaySlots();
  if (!slots.length) { toast("Add at least one exercise first"); return; }
  const plan = slots.map(planFor);
  state.active = {
    id: "w" + Date.now(),
    kind: "lift",
    dayName,
    startedAt: Date.now(),
    endedAt: null,
    unit: unit(),
    plan,
    entries: plan.map((p) => ({ exerciseId: p.exerciseId, sets: [] })),
    drafts: Object.fromEntries(plan.map((p) => [p.exerciseId, { weight: p.weight, reps: p.reps, rir: 2, warmup: false }])),
    warmDone: {},
    restStart: null,
    restExercise: null,
    restWarm: false,
    nextSetStartedAt: null,
    notes: "",
  };
  persist();
  requestWakeLock();
  render();
}

function addExercise(id) {
  const a = state.active;
  if (a.plan.some((p) => p.exerciseId === id)) return;
  const p = planFor(defaultSlot(id));
  a.plan.push(p);
  a.entries.push({ exerciseId: id, sets: [] });
  a.drafts[id] = { weight: p.weight, reps: p.reps, rir: 2, warmup: false };
  state.addExerciseOpen = false;
  persist();
  render();
}

function pushSet(exerciseId, set, warm) {
  const a = state.active;
  const entry = a.entries.find((e) => e.exerciseId === exerciseId);
  entry.sets.push(set);
  const index = entry.sets.length - 1;
  a.restStart = set.completedAt;
  a.restExercise = exerciseId;
  a.restWarm = warm;
  a.nextSetStartedAt = null;
  persist();
  render();
  toast(warm ? "Warm-up logged" : "Set logged", () => deleteSet("active", exerciseId, index), "Undo");
}

function logSet(exerciseId) {
  const a = state.active;
  const d = a.drafts[exerciseId];
  const plan = a.plan.find((p) => p.exerciseId === exerciseId);
  pushSet(exerciseId, {
    weight: Number(d.weight) || 0,
    reps: Number(d.reps) || 0,
    targetReps: plan.reps,
    rir: d.warmup ? null : d.rir,
    warmup: d.warmup,
    startedAt: a.nextSetStartedAt,
    completedAt: Date.now(),
  }, d.warmup);
  if (d.warmup) { d.warmup = false; persist(); render(); }
}

function logWarmup(exerciseId, i) {
  const a = state.active;
  const plan = a.plan.find((p) => p.exerciseId === exerciseId);
  const wu = warmupSets(EXERCISES[exerciseId], plan.weight, bar(), step())[i];
  if (!wu) return;
  a.warmDone ??= {};
  a.warmDone[exerciseId] = [...(a.warmDone[exerciseId] ?? []), i];
  pushSet(exerciseId, {
    weight: wu.weight, reps: wu.reps, targetReps: wu.reps, rir: null, warmup: true, wi: i,
    startedAt: a.nextSetStartedAt, completedAt: Date.now(),
  }, true);
}

function deleteSet(scope, exerciseId, index) {
  const w = getWorkout(scope);
  const entry = getEntry(scope, exerciseId);
  if (!w || !entry || !entry.sets[index]) return;
  const [removed] = entry.sets.splice(index, 1);
  if (scope === "active") {
    if (removed.warmup && removed.wi !== undefined) {
      w.warmDone[exerciseId] = (w.warmDone[exerciseId] ?? []).filter((x) => x !== removed.wi);
    }
    // If the removed set started the current rest, fall back to the previous set (or no rest).
    if (w.restStart === removed.completedAt) {
      const all = w.entries.flatMap((e) => e.sets.map((s) => ({ s, id: e.exerciseId })))
        .sort((x, y) => y.s.completedAt - x.s.completedAt);
      w.restStart = all[0]?.s.completedAt ?? null;
      w.restExercise = all[0]?.id ?? null;
      w.restWarm = all[0]?.s.warmup ?? false;
    }
  } else {
    w.entries = w.entries.filter((e) => e.sets.length);
  }
  state.editing = null;
  persist();
  render();
}

function openEditor(scope, exerciseId, index) {
  const s = getEntry(scope, exerciseId)?.sets[index];
  if (!s) return;
  state.editing = { scope, exerciseId, index };
  state.editDraft = { weight: s.weight, reps: s.reps, rir: s.rir ?? 2, warmup: s.warmup };
  render();
}

function saveEdit() {
  const { scope, exerciseId, index } = state.editing;
  const s = getEntry(scope, exerciseId)?.sets[index];
  const d = state.editDraft;
  if (s) {
    s.weight = Number(d.weight) || 0;
    s.reps = Number(d.reps) || 0;
    s.warmup = d.warmup;
    s.rir = d.warmup ? null : d.rir;
  }
  state.editing = null;
  persist();
  render();
  toast("Set updated");
}

function finishWorkout() {
  const a = state.active;
  const workout = {
    id: a.id, kind: "lift", dayName: a.dayName, startedAt: a.startedAt, endedAt: Date.now(), unit: a.unit,
    entries: a.entries.filter((e) => e.sets.length), notes: a.notes,
  };
  if (!workout.entries.some((e) => workingSets(e).length)) { toast("Log at least one work set before finishing"); return; }
  state.editing = null;
  state.finished = workout;
  render();
}

function saveFinished() {
  const w = state.finished;
  state.history.push(w);
  state.finished = null;
  if (isLift(w)) { state.active = null; releaseWakeLock(); }
  persist();
  toast(isLift(w) ? "Workout saved" : "Activity saved");
  render();
}

function saveActivity() {
  const f = state.activityForm;
  const minutes = Number(f.minutes) || 0;
  if (!minutes) { toast("Enter how many minutes"); return; }
  const now = Date.now();
  state.finished = {
    id: "a" + now, kind: "activity", dayName: "", startedAt: now - minutes * 60_000, endedAt: now, unit: unit(),
    entries: [], notes: (f.notes || "").trim(),
    activity: { type: f.type, minutes, distance: Number(f.distance) || null, distanceUnit: "mi", effort: f.effort },
  };
  state.activityForm = null;
  render();
}

function nextUpAfter(history) {
  const day = nextDay(program(), history);
  return day.slots.map((sl) => prescribe(EXERCISES[sl.exerciseId], sl, history, state.settings));
}

// ---------- Wake lock (keeps the screen on during a workout, where allowed) ----------
let wakeLock = null;
async function requestWakeLock() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch { wakeLock = null; }
}
function releaseWakeLock() { try { wakeLock?.release(); } catch {} wakeLock = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.active) requestWakeLock();
});

// ---------- Shared pieces ----------
const stepper = (id, label, value, action, field, delta, mode = "decimal") => `
  <div class="field">
    <label for="${id}">${label}</label>
    <div class="stepper">
      <button data-action="${action}-step" data-field="${field}" data-delta="-${delta}" aria-label="Less ${label.toLowerCase()}">−</button>
      <input id="${id}" type="number" inputmode="${mode}" step="${delta}" min="0" value="${esc(value)}" data-action="${action}-field" data-field="${field}">
      <button data-action="${action}-step" data-field="${field}" data-delta="${delta}" aria-label="More ${label.toLowerCase()}">+</button>
    </div>
  </div>`;

/** The stepper/RIR/warm-up controls; `action` prefixes the data-actions so one renderer
 *  serves both the live entry row and the set editor. */
function setControls(prefix, d, action, extraAttrs = "") {
  return `
    ${stepper(`${prefix}-w`, "Weight", d.weight, action, "weight", step()).replace(/data-field=/g, `${extraAttrs} data-field=`)}
    ${stepper(`${prefix}-r`, "Reps", d.reps, action, "reps", 1, "numeric").replace(/data-field=/g, `${extraAttrs} data-field=`)}
    <div class="field rirfield">
      <span class="flabel" id="${prefix}-rirl">Reps left in the tank</span>
      <div class="seg" role="radiogroup" aria-labelledby="${prefix}-rirl">
        ${[0, 1, 2, 3, 4].map((v) => `<button role="radio" aria-checked="${d.rir === v && !d.warmup}" class="${d.rir === v && !d.warmup ? "on" : ""}" data-action="${action}-rir" ${extraAttrs} data-v="${v}" ${d.warmup ? "disabled" : ""}>${v === 4 ? "4+" : v}</button>`).join("")}
      </div>
    </div>
    <label class="wu-toggle" for="${prefix}-wu"><input id="${prefix}-wu" type="checkbox" ${d.warmup ? "checked" : ""} data-action="${action}-warmup" ${extraAttrs}> Warm-up set</label>`;
}

function setList(scope, entry) {
  if (!entry.sets.length) return "";
  const rests = restIntervals(entry);
  let workNo = 0;
  const rows = entry.sets.map((s, i) => {
    if (!s.warmup) workNo++;
    const ed = state.editing;
    if (ed && ed.scope === scope && ed.exerciseId === entry.exerciseId && ed.index === i) {
      return `
        <li class="editrow">
          <p class="label">Edit ${s.warmup ? "warm-up" : "set " + workNo}</p>
          <div class="entry">
            ${setControls("ed", state.editDraft, "ed")}
            <div class="edactions">
              <button class="primary" data-action="ed-save">Save</button>
              <button class="danger" data-action="ed-delete">Delete set</button>
              <button class="ghost" data-action="ed-cancel">Cancel</button>
            </div>
          </div>
        </li>`;
    }
    return `
      <li>
        <button class="setrow ${s.warmup ? "wu" : hitTarget(s) ? "hit" : "miss"}" data-action="edit-set" data-scope="${esc(scope)}" data-id="${entry.exerciseId}" data-i="${i}" aria-label="Edit this set">
          <span class="n">${s.warmup ? "WU" : workNo}</span>
          <span class="wr">${weightLabel(s.weight)} × ${s.reps}</span>
          <span class="rir">${s.rir === null || s.rir === undefined ? "" : "RIR " + s.rir}</span>
          <span class="rs">${i > 0 ? "rest " + clock(rests[i - 1]) : ""}</span>
          <span class="pen" aria-hidden="true">Edit</span>
        </button>
      </li>`;
  }).join("");
  return `<ol class="sets">${rows}</ol>`;
}

function recoveryBanner() {
  const r = recovery(state.history);
  if (!r) return "";
  const head = r.ready
    ? `<strong>Ready to lift.</strong> ${hoursLabel(r.hoursSince)} since your last session.`
    : `<strong>Recovering.</strong> Ready around ${esc(timeLabel(r.readyAt))} (in ${hoursLabel(r.hoursLeft)}).`;
  return `
    <div class="recov ${r.ready ? "ok" : "wait"}" role="status">
      <p>${head}</p>
      <p class="note">${esc(r.reason)}</p>
      ${r.hardCardio ? `<p class="note">You logged hard cardio since then. Hard endurance work close to lifting can blunt strength and power, so keep cardio easy on lifting days or put it on rest days.</p>` : ""}
    </div>`;
}

// ---------- Views ----------
function viewToday() {
  if (state.finished) return viewFinished();
  if (state.active) return viewActive();
  if (state.activityForm) return viewActivityForm();

  const prog = program();
  const { dayName, slots } = todaySlots();
  const lifts = state.history.filter(isLift);
  const last = lifts.length ? [...lifts].sort((a, b) => b.startedAt - a.startedAt)[0] : null;

  const freestylePicker = state.settings.followProgram ? "" : `
    <div class="picker">
      <p class="label">Pick today's lifts</p>
      <div class="chips">
        ${Object.values(EXERCISES).map((ex) => `
          <button class="chip ${state.freestyle.includes(ex.id) ? "on" : ""}" data-action="toggle-free" data-id="${ex.id}" aria-pressed="${state.freestyle.includes(ex.id)}">${esc(ex.name)}</button>`).join("")}
      </div>
    </div>`;

  const cards = slots.map((sl) => {
    const ex = EXERCISES[sl.exerciseId];
    const p = prescribe(ex, sl, state.history, state.settings);
    const first = p.flags.includes("firstSession");
    const flagPills = p.flags.filter((f) => f !== "firstSession").map((f) => ({
      deload: `<span class="pill warn">Deload</span>`,
      considerIntermediate: `<span class="pill bad">Stalled twice</span>`,
    }[f])).join("");
    const weightBlock = first
      ? `<label class="startw" for="sw-${ex.id}">Starting weight
           <span class="inline-input"><input id="sw-${ex.id}" type="number" inputmode="decimal" step="${step()}" min="0"
             placeholder="${bar()}" value="${esc(state.startWeights[ex.id] ?? "")}" data-action="start-weight" data-id="${ex.id}"> ${unit()}</span></label>`
      : `<div class="target"><span class="big">${fmt(p.weight)}</span><span class="unit">${unit()}</span></div>
         <div class="plates">${esc(plateLine(p.weight))}</div>`;
    const wl = first ? "" : warmupLine(ex, p.weight);
    return `
      <article class="lift">
        <header>
          <h3>${esc(ex.name)}</h3>
          <span class="scheme">${p.sets}×${p.reps}</span>
          ${flagPills}
          ${ex.category === "power" ? `<span class="pill">Power</span>` : ""}
        </header>
        ${weightBlock}
        ${wl ? `<p class="wline">${esc(wl)}</p>` : ""}
        <p class="why">${esc(p.rationale)}</p>
        <p class="rest">Rest ${clock(ex.rest[0])}–${clock(ex.rest[1])} between work sets</p>
      </article>`;
  }).join("");

  return `
    <section class="today">
      <div class="dayhead">
        <div>
          <p class="label">Your next workout</p>
          <h2>${dayName ? esc(dayTitle(dayName)) : "Freestyle"}</h2>
          <p class="sub">${state.settings.followProgram ? esc(prog.name) : "Your pick of lifts"} · ${last ? "last lift " + dateLabel(last.startedAt) : "no sessions logged yet"}</p>
        </div>
      </div>
      ${recoveryBanner()}
      ${freestylePicker}
      <div class="lifts">${cards || `<p class="empty">Pick at least one lift above.</p>`}</div>
      <p class="note" style="text-align:center">Warm-up sets are suggested for each lift once you start.</p>
      <button class="primary wide" data-action="start">Start ${dayName ? esc(dayTitle(dayName)) : "workout"}</button>
      <button class="ghost wide" data-action="activity-open">Log cardio or other training</button>
    </section>`;
}

function viewActive() {
  const a = state.active;
  const cards = a.plan.map((p) => {
    const ex = EXERCISES[p.exerciseId];
    const id = p.exerciseId;
    const entry = a.entries.find((e) => e.exerciseId === id);
    const d = a.drafts[id];
    const work = workingSets(entry).length;
    const done = work >= p.sets;
    const wu = warmupSets(ex, p.weight, bar(), step());
    const wDone = a.warmDone?.[id] ?? [];
    const warmBlock = wu.length && work === 0 ? `
      <div class="warmups">
        <span class="flabel">Suggested warm-up · tap each set as you finish it</span>
        <div class="wchips">
          ${wu.map((s, i) => `<button class="wchip ${wDone.includes(i) ? "done" : ""}" data-action="log-warm" data-id="${id}" data-i="${i}" ${wDone.includes(i) ? "disabled" : ""}>${weightLabel(s.weight)}×${s.reps}${wDone.includes(i) ? " ✓" : ""}</button>`).join("")}
        </div>
      </div>` : "";
    return `
      <article class="lift live ${done ? "done" : ""}">
        <header>
          <h3>${esc(ex.name)}</h3>
          <span class="scheme">${p.sets}×${p.reps} @ ${fmt(p.weight)}</span>
          <span class="count">${Math.min(work, p.sets)}/${p.sets}</span>
        </header>
        <div class="plates">${esc(plateLine(p.weight))}</div>
        ${warmBlock}
        ${setList("active", entry)}
        <div class="entry">
          ${setControls("e-" + id, d, "draft", `data-id="${id}"`)}
          <button class="primary" data-action="log" data-id="${id}">Log set</button>
        </div>
      </article>`;
  }).join("");

  const others = Object.values(EXERCISES).filter((ex) => !a.plan.some((p) => p.exerciseId === ex.id));
  const addBlock = state.addExerciseOpen ? `
    <div class="picker">
      <p class="label">Add a lift to this workout</p>
      <div class="chips">
        ${others.map((ex) => `<button class="chip" data-action="add-ex" data-id="${ex.id}">${esc(ex.name)}</button>`).join("")}
        <button class="chip" data-action="add-ex-close">Cancel</button>
      </div>
    </div>` : others.length ? `<button class="ghost wide" data-action="add-ex-open">+ Add a lift</button>` : "";

  const restEx = a.restExercise ? EXERCISES[a.restExercise] : null;
  return `
    <section class="active">
      <div class="dayhead">
        <div>
          <p class="label">In progress${a.dayName ? " · " + esc(dayTitle(a.dayName)) : ""}</p>
          <h2 class="clock" id="workout-clock">${clock((Date.now() - a.startedAt) / 1000)}</h2>
        </div>
        <button class="ghost" data-action="finish">Finish</button>
      </div>
      <p class="note">Tap any logged set to fix or delete it.</p>
      <div class="lifts">${cards}</div>
      ${addBlock}
      <div class="discard">
        ${state.confirmDiscard
          ? `<span>Discard this workout? Logged sets will be lost.</span>
             <button class="danger" data-action="discard-yes">Discard</button>
             <button class="ghost" data-action="discard-no">Keep</button>`
          : `<button class="link" data-action="discard">Discard workout</button>`}
      </div>
    </section>
    <div class="restbar" id="restbar" ${a.restStart ? "" : "hidden"}>
      <div class="restinfo">
        <span class="label">${a.restWarm ? "Warm-up rest" : "Rest"}${restEx ? " · " + esc(restEx.short) : ""}</span>
        <span class="clock" id="rest-clock">0:00</span>
        <span class="range">${a.restWarm ? "move on when ready" : restEx ? "target " + clock(restEx.rest[0]) + "–" + clock(restEx.rest[1]) : ""}</span>
      </div>
      <div class="restmeter"><div id="rest-fill"></div></div>
      <button class="ghost small" data-action="start-set" ${a.nextSetStartedAt ? "disabled" : ""}>${a.nextSetStartedAt ? "Set started" : "Start next set"}</button>
    </div>`;
}

function smsHref(text) { return "sms:?&body=" + encodeURIComponent(text); }

function viewFinished() {
  const w = state.finished;
  const lift = isLift(w);
  const text = summaryText(w, lift ? nextUpAfter([...state.history, w]) : []);
  return `
    <section class="finished">
      <p class="label">${lift ? "Workout complete" : "Activity logged"}</p>
      <h2>${lift ? `${Math.round(durationSeconds(w) / 60)} min · ${workingSetCount(w)} work sets` : esc(activityLine(w))}</h2>
      ${lift ? `<p class="note">Spot a mistake? Save it, then fix any set from History → Edit.</p>` : ""}
      <label class="label" for="summary">Summary to send</label>

      <div class="actions">

        <button class="ghost" data-action="copy-summary">Copy text</button>
      </div>
      <p class="note">Messages opens with the text filled in; you choose who gets it and tap Send. If nothing opens, use Copy text.</p>
      <button class="primary wide" data-action="save">${lift ? "Save workout" : "Save activity"}</button>
    </section>`;
}

function sparkline(points) {
  if (points.length < 2) return "";
  const W = 120, H = 32, P = 3;
  const vs = points.map((p) => p.value);
  const lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1;
  const xy = points.map((p, i) => [P + (i * (W - 2 * P)) / (points.length - 1), H - P - ((p.value - lo) / span) * (H - 2 * P)]);
  const line = xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  const [ex, ey] = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
    <polyline points="${P},${H - P} ${line} ${W - P},${H - P}" fill="var(--accent-soft)" stroke="none"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${ex}" cy="${ey}" r="2.6" fill="var(--accent)"/></svg>`;
}

function viewHistory() {
  if (state.sessionOpen) return viewSession();
  const h = [...state.history].sort((a, b) => b.startedAt - a.startedAt);
  const hasExamples = h.some((w) => w.example);
  if (!h.length) {
    return `
      <section class="history">
        <div class="emptystate">
          <h2>No workouts yet</h2>
          <p>Finished workouts and activities appear here, with your estimated one-rep max for each lift.</p>
          <button class="ghost" data-action="load-examples">Load example history</button>
          <p class="note">Example sessions are labeled and can be cleared in Settings.</p>
        </div>
        ${backupBlock()}
      </section>`;
  }
  const liftHistory = h.filter(isLift);
  const tiles = Object.values(EXERCISES)
    .map((ex) => ({ ex, trend: e1RMTrend(ex.id, liftHistory) }))
    .filter((x) => x.trend.length)
    .map(({ ex, trend }) => {
      const latest = trend[trend.length - 1].value;
      const delta = latest - trend[0].value;
      return `<div class="e1">
        <span class="label">${esc(ex.short)}</span>
        <span class="big">${Math.round(latest)}</span>
        <span class="sub">est. 1RM · ${delta >= 0 ? "+" : ""}${Math.round(delta)} ${unit()}</span>
        ${sparkline(trend)}
      </div>`;
    }).join("");
  const rows = h.map((w) => {
    const lift = isLift(w);
    const body = lift ? summaryText(w).split("\n").slice(1, -1).join("\n") : [activityLine(w), w.notes].filter(Boolean).join("\n");
    return `
    <li class="session ${lift ? "" : "act"}">
      <div class="when">
        <strong>${dateLabel(w.startedAt)}</strong>
        <span>${lift ? (w.dayName ? esc(dayTitle(w.dayName)) + " · " : "") + (durationSeconds(w) ? Math.round(durationSeconds(w) / 60) + " min" : "") : "Activity"}</span>
        ${w.example ? `<span class="pill">Example</span>` : ""}
      </div>
      <pre>${esc(body)}</pre>
      <div class="tools">
        <button class="link" data-action="session-open" data-id="${esc(w.id)}">Edit</button>
        <a class="link" href="${smsHref(summaryText(w))}">Text</a>
      </div>
    </li>`;
  }).join("");
  return `
    <section class="history">
      ${hasExamples ? `<p class="banner">Showing example sessions. Clear them in Settings before you start logging for real.</p>` : ""}
      ${tiles ? `<h2>Strength trend</h2>
      <p class="note">Estimated one-rep max from your best set each session (reps plus reps in reserve, Epley formula).</p>
      <div class="e1grid">${tiles}</div>` : ""}
      <h2>Sessions</h2>
      <ol class="sessions">${rows}</ol>
      ${backupBlock()}
    </section>`;
}

function viewSession() {
  const w = state.history.find((x) => x.id === state.sessionOpen);
  if (!w) { state.sessionOpen = null; return viewHistory(); }
  const lift = isLift(w);
  const body = lift
    ? w.entries.map((e) => `
        <article class="lift">
          <header><h3>${esc(EXERCISES[e.exerciseId]?.name ?? e.exerciseId)}</h3></header>
          ${setList(w.id, e)}
        </article>`).join("") || `<p class="note">No sets left in this session.</p>`
    : `
      <div class="row2">
        <label class="field" for="se-min">Minutes
          <input id="se-min" type="number" inputmode="numeric" value="${esc(w.activity.minutes)}" data-action="se-field" data-field="minutes"></label>
        <label class="field" for="se-dist">Distance (mi)
          <input id="se-dist" type="number" inputmode="decimal" step="0.1" value="${esc(w.activity.distance ?? "")}" data-action="se-field" data-field="distance"></label>
      </div>
      <div class="seg seg3" role="radiogroup" aria-label="Effort">
        ${["easy", "moderate", "hard"].map((e) => `<button role="radio" aria-checked="${w.activity.effort === e}" class="${w.activity.effort === e ? "on" : ""}" data-action="se-effort" data-v="${e}">${e[0].toUpperCase() + e.slice(1)}</button>`).join("")}
      </div>
      <label class="field" for="se-notes">Notes
        <textarea id="se-notes" rows="2" data-action="se-field" data-field="notes">${esc(w.notes)}</textarea></label>`;
  return `
    <section class="history">
      <div class="dayhead">
        <div>
          <p class="label">Edit session</p>
          <h2>${dateLabel(w.startedAt)}${lift && w.dayName ? " · " + esc(dayTitle(w.dayName)) : ""}</h2>
        </div>
        <button class="primary" data-action="session-close">Done</button>
      </div>
      ${lift ? `<p class="note">Tap a set to fix or delete it. Next-session weights recalculate from your edits.</p>` : ""}
      <div class="lifts">${body}</div>
      <div class="discard">
        ${state.confirmDeleteSession
          ? `<span>Delete this whole session?</span>
             <button class="danger" data-action="session-delete-yes">Delete</button>
             <button class="ghost" data-action="session-delete-no">Keep</button>`
          : `<button class="link" data-action="session-delete">Delete this session</button>`}
      </div>
    </section>`;
}

function backupBlock() {
  return `
    <div class="backup">
      <h3>Backup</h3>
      <p class="note">Your history lives only in this browser. Copy a backup now and then, and paste it here to restore.</p>
      <div class="actions">
        <button class="ghost" data-action="copy-backup">Copy backup</button>

    </div>`;
}

function viewSettings() {
  const s = state.settings;
  const prog = program();
  const radio = (name, value, label, hint = "") => `
    <label class="opt ${s[name] === value ? "on" : ""}" for="${name}-${value}">
      <input type="radio" id="${name}-${value}" name="${name}" value="${value}" ${s[name] === value ? "checked" : ""} data-action="setting" data-key="${name}">
      <span><strong>${label}</strong>${hint ? `<small>${hint}</small>` : ""}</span>
    </label>`;
  const themeBtn = (v, label, icon) => `
    <button class="${s.theme === v ? "on" : ""}" aria-pressed="${s.theme === v}" data-action="theme" data-v="${v}">${icon}${label}</button>`;
  return `
    <section class="settings">
      <h2>Appearance</h2>
      <div class="seg seg2" role="group" aria-label="Theme">
        ${themeBtn("dark", "Dark", `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`)}
        ${themeBtn("light", "Light", `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`)}
      </div>
      <h2>Goal</h2>
      <div class="opts">
        ${radio("goal", "strength", "Strength", "Heavy compound lifts, 1–6 reps")}
        ${radio("goal", "strengthAndPower", "Strength + power", "Explosive lift first on Clean & Press day")}
      </div>
      <h2>Stage</h2>
      <div class="opts">
        ${radio("trainingAge", "novice", "Novice", "Adding weight every session")}
        ${radio("trainingAge", "intermediate", "Intermediate", "Per-session progress has stalled")}
      </div>
      <div class="programcard">
        <p class="label">Recommended program</p>
        <h3>${esc(prog.name)}</h3>
        <p class="meta">${esc(prog.schedule)}${prog.blockWeeks ? " · " + prog.blockWeeks + "-week blocks" : " · open-ended"}</p>
        <p>${esc(prog.rationale)}</p>
        ${prog.progression === "weekly" ? `<p class="note">Week-to-week progression rules for this program come in a later build. For now the app uses per-session rules.</p>` : ""}
        <label class="switch" for="follow"><input id="follow" type="checkbox" ${s.followProgram ? "checked" : ""} data-action="follow"> Follow this program (off = freestyle)</label>
      </div>
      <h2>Plates</h2>
      <div class="opts">
        ${radio("smallestJump", 5, "Smallest jump 5 lb", "2.5 lb plates")}
        ${radio("smallestJump", 2.5, "Smallest jump 2.5 lb", "1.25 lb microplates")}
      </div>
      <label class="field inline" for="bar">Bar weight
        <span class="inline-input"><input id="bar" type="number" inputmode="decimal" value="${s.barWeight}" data-action="bar"> lb</span></label>
      ${state.history.some((w) => w.example) ? `<button class="ghost" data-action="clear-examples">Clear example sessions</button>` : ""}
      <p class="note">LiftLog stores everything on this device. Nothing is sent anywhere unless you tap Text and send the message yourself.</p>
    </section>`;
}

// ---------- Render ----------
const TAB_ICONS = {
  today: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>`,
  history: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>`,
  settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>`,
};

function applyTheme() {
  const theme = state.settings.theme === "light" ? "light" : "dark";
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "light" ? "#F4F4F1" : "#0E0F11");
}

function render() {
  applyTheme();
  const tabs = [["today", state.active ? "Workout" : "Next", "Your next workout"], ["history", "History", ""], ["settings", "Settings", ""]];
  $("#app").innerHTML = `
    <header class="top">
      <div class="brand"><span class="mark" aria-hidden="true"></span>LiftLog</div>
    </header>
    <nav class="tabs" aria-label="Sections">
      ${tabs.map(([v, l, aria]) => `<button class="${state.view === v ? "on" : ""}" aria-current="${state.view === v ? "page" : "false"}" ${aria && !state.active ? `aria-label="${aria}"` : ""} data-action="view" data-v="${v}">${TAB_ICONS[v]}${l}</button>`).join("")}
    </nav>
    <main>${state.view === "today" ? viewToday() : state.view === "history" ? viewHistory() : viewSettings()}</main>
    <div id="toast" class="toast" role="status" hidden></div>`;
  renderToast();
  tick();
}

// Updates timers in place so inputs keep focus.
function tick() {
  const a = state.active;
  if (!a) return;
  const wc = $("#workout-clock");
  if (wc) wc.textContent = clock((Date.now() - a.startedAt) / 1000);
  if (a.restStart) {
    const sec = (Date.now() - a.restStart) / 1000;
    const rc = $("#rest-clock"), fill = $("#rest-fill"), barEl = $("#restbar");
    const [lo, hi] = a.restWarm ? [60, 120] : EXERCISES[a.restExercise]?.rest ?? [180, 300];
    if (rc) rc.textContent = clock(sec);
    if (fill) fill.style.width = Math.min(100, (sec / hi) * 100) + "%";
    if (barEl) barEl.dataset.zone = sec < lo ? "early" : sec <= hi ? "ready" : "long";
  }
}
setInterval(tick, 1000);

// ---------- Events ----------
function stepValue(obj, field, delta) {
  obj[field] = Math.max(0, Math.round(((Number(obj[field]) || 0) + Number(delta)) * 100) / 100);
}

document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("[data-action]");
  if (!t || t.tagName === "INPUT" || t.tagName === "TEXTAREA") return;
  const { action, id } = t.dataset;
  const a = state.active;
  switch (action) {
    case "view":
      state.view = t.dataset.v; state.confirmDiscard = false; state.sessionOpen = null; state.editing = null; render(); break;
    case "start": startWorkout(); break;
    case "toggle-free":
      state.freestyle = state.freestyle.includes(id) ? state.freestyle.filter((x) => x !== id) : [...state.freestyle, id];
      render(); break;

    // live entry row
    case "draft-step": stepValue(a.drafts[id], t.dataset.field, t.dataset.delta); persist(); render(); break;
    case "draft-rir": a.drafts[id].rir = Number(t.dataset.v); persist(); render(); break;
    case "log": logSet(id); break;
    case "log-warm": logWarmup(id, Number(t.dataset.i)); break;
    case "start-set": a.nextSetStartedAt = Date.now(); persist(); render(); break;
    case "add-ex-open": state.addExerciseOpen = true; render(); break;
    case "add-ex-close": state.addExerciseOpen = false; render(); break;
    case "add-ex": addExercise(id); break;

    // set editor
    case "edit-set": openEditor(t.dataset.scope, id, Number(t.dataset.i)); break;
    case "ed-step": stepValue(state.editDraft, t.dataset.field, t.dataset.delta); render(); break;
    case "ed-rir": state.editDraft.rir = Number(t.dataset.v); render(); break;
    case "ed-save": saveEdit(); break;
    case "ed-cancel": state.editing = null; render(); break;
    case "ed-delete": {
      const { scope, exerciseId, index } = state.editing;
      deleteSet(scope, exerciseId, index);
      toast("Set deleted");
      break;
    }
    case "toast-action": {
      const fn = state.toast?.action;
      state.toast = null; renderToast();
      if (fn) { fn(); toast("Undone"); }
      break;
    }

    case "finish": finishWorkout(); break;
    case "discard": state.confirmDiscard = true; render(); break;
    case "discard-no": state.confirmDiscard = false; render(); break;
    case "discard-yes":
      state.active = null; state.confirmDiscard = false; state.editing = null; persist(); releaseWakeLock(); toast("Workout discarded"); render(); break;
    case "save": saveFinished(); break;
    case "copy-summary": copy($("#summary").value, "Summary copied", $("#summary")); break;

    // activities
    case "activity-open": state.activityForm = { type: "run", minutes: "", distance: "", effort: "moderate", notes: "" }; render(); break;
    case "act-type": state.activityForm.type = t.dataset.v; render(); break;
    case "act-effort": state.activityForm.effort = t.dataset.v; render(); break;
    case "act-save": saveActivity(); break;
    case "act-cancel": state.activityForm = null; render(); break;

    // history session editor
    case "session-open": state.sessionOpen = id; state.confirmDeleteSession = false; state.editing = null; render(); window.scrollTo(0, 0); break;
    case "session-close": state.sessionOpen = null; state.editing = null; render(); break;
    case "session-delete": state.confirmDeleteSession = true; render(); break;
    case "session-delete-no": state.confirmDeleteSession = false; render(); break;
    case "session-delete-yes":
      state.history = state.history.filter((w) => w.id !== state.sessionOpen);
      state.sessionOpen = null; state.confirmDeleteSession = false; persist(); toast("Session deleted"); render(); break;
    case "se-effort": {
      const w = state.history.find((x) => x.id === state.sessionOpen);
      w.activity.effort = t.dataset.v; persist(); render(); break;
    }

    case "copy-backup": copy(JSON.stringify({ app: "LiftLog", version: 2, history: state.history, settings: state.settings }), "Backup copied"); break;
    case "theme": state.settings.theme = t.dataset.v === "light" ? "light" : "dark"; persist(); render(); break;
    case "toggle-restore": state.restoreOpen = !state.restoreOpen; render(); break;
    case "restore": restore($("#restore").value); break;
    case "load-examples": state.history = exampleHistory(); persist(); toast("Example sessions loaded"); render(); break;
    case "clear-examples": state.history = state.history.filter((w) => !w.example); persist(); toast("Example sessions cleared"); render(); break;
  }
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  const { action, id, field } = t.dataset;
  if (action === "draft-field") { state.active.drafts[id][field] = Number(t.value); persist(); }
  if (action === "draft-warmup") { state.active.drafts[id].warmup = t.checked; persist(); render(); }
  if (action === "ed-field") state.editDraft[field] = Number(t.value);
  if (action === "ed-warmup") { state.editDraft.warmup = t.checked; render(); }
  if (action === "start-weight") state.startWeights[id] = t.value;
  if (action === "act-field") state.activityForm[field] = t.value;
  if (action === "se-field") {
    const w = state.history.find((x) => x.id === state.sessionOpen);
    if (field === "notes") w.notes = t.value;
    else w.activity[field] = Number(t.value) || (field === "distance" ? null : w.activity[field]);
    persist();
  }
  if (action === "setting") {
    const v = t.value;
    state.settings[t.dataset.key] = isNaN(Number(v)) ? v : Number(v);
    persist(); render();
  }
  if (action === "follow") { state.settings.followProgram = t.checked; persist(); render(); }
  if (action === "bar") { state.settings.barWeight = Number(t.value) || 45; persist(); }
});

async function copy(text, msg, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch {
    if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); toast("Selected: press Copy"); }
    else toast("Copy isn't allowed here");
  }
}

function restore(text) {
  try {
    const data = JSON.parse(text);
    if (!Array.isArray(data.history)) throw new Error();
    state.history = data.history;
    if (data.settings) state.settings = { ...DEFAULT_SETTINGS, ...data.settings };
    state.restoreOpen = false;
    persist(); toast(`Restored ${data.history.length} sessions`); render();
  } catch { toast("That isn't a LiftLog backup. Paste the full text from Copy backup."); }
}

// Example data: ten sessions of a plausible A/B progression plus two activities, marked example:true.
function exampleHistory() {
  const out = [];
  const day = 172_800_000;
  const start = Date.now() - 10 * day;   // every other day, ending two days ago
  const w = { squat: 185, bench: 145, deadlift: 225, ohp: 95, power_clean: 115 };
  const add = { squat: 5, bench: 5, deadlift: 10, ohp: 5, power_clean: 5 };
  for (let i = 0; i < 10; i++) {
    const dayName = i % 2 ? "B" : "A";
    const s0 = start + i * day;
    const slots = PROGRAMS["nlp-ab-power"].days[i % 2].slots;
    let t = s0;
    const entries = slots.map((sl) => {
      const sets = [];
      for (const wu of warmupSets(EXERCISES[sl.exerciseId], w[sl.exerciseId])) {
        t += 90_000;
        sets.push({ weight: wu.weight, reps: wu.reps, targetReps: wu.reps, rir: null, warmup: true, startedAt: null, completedAt: t });
      }
      for (let k = 0; k < sl.sets; k++) {
        t += 210_000;
        const missed = sl.exerciseId === "ohp" && i === 9 && k === 2;
        sets.push({ weight: w[sl.exerciseId], reps: missed ? sl.reps - 1 : sl.reps, targetReps: sl.reps,
          rir: missed ? 0 : k === sl.sets - 1 ? 1 : 2, warmup: false, startedAt: null, completedAt: t });
      }
      return { exerciseId: sl.exerciseId, sets };
    });
    for (const sl of slots) if (!(sl.exerciseId === "ohp" && i === 9)) w[sl.exerciseId] += add[sl.exerciseId];
    out.push({ id: "ex" + i, kind: "lift", dayName, startedAt: s0, endedAt: t + 120_000, unit: "lb", entries, notes: "", example: true });
  }
  const act = (offset, type, minutes, distance, effort, notes) => ({
    id: "exa" + offset, kind: "activity", dayName: "", startedAt: start + offset * 86_400_000, endedAt: start + offset * 86_400_000 + minutes * 60_000,
    unit: "lb", entries: [], notes, example: true, activity: { type, minutes, distance, distanceUnit: "mi", effort },
  });
  out.push(act(5, "throws", 45, null, "moderate", "Stone and weight-for-distance, 12 throws each"));
  out.push(act(13, "bike", 30, 8, "easy", ""));
  return out;
}

render();
if (state.active) requestWakeLock();

</script>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
